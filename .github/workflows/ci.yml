# Continuous integration for Turing (docs/16, tools/CI.md). The audit stages
# are the same ones tools/ci.py runs locally, so a green run here means the
# same as a green `python tools/ci.py`; this workflow adds the one thing a
# single developer machine cannot give: the tests built and run on Linux and
# Windows, which exercise the library's per-platform memory and randomness
# code (bombe's memory scanner has Linux and Windows back-ends only, so the
# matrix stops there). The Rust version is pinned by rust-toolchain.toml, so
# every job and every local build lint against the same compiler.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: rustup show      # installs the version rust-toolchain.toml pins
      # cargo build --release --workspace
      - name: Build
        run: cargo build --release --workspace
      # cargo test --release --workspace
      - name: Test
        run: cargo test --release --workspace
      # The library alone: a workspace build turns on Bombe's `analysis`
      # feature, whose code inlines differently from what users build.
      - name: Test the production library
        run: cargo test --release -p turing

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: rustup show
      # cargo clippy --release --workspace --all-targets -- -D warnings
      - name: Clippy
        run: cargo clippy --release --workspace --all-targets -- -D warnings

  # The generated-code and maths audits, run through the canonical local
  # runner so CI and `python tools/ci.py` check exactly the same things:
  #   math-audit     docs/16, docs/14, docs/15 numbers recomputed independently
  #   constant-time  the release build's assembly divides no secret (tools/ct_check.py)
  #   mutation-patterns  every planted bug of every set still matches the code
  #   noise          real Turing-1026 ciphertexts' error against docs/16's exact law
  #   simulate       docs/16's failure law against an FFT and exact sampling (on
  #                  these GPU-less runners, NumPy on the CPU)
  audit:
    name: generated-code and maths audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: rustup show
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Python dependencies
        run: pip install numpy mpmath
      # python tools/ci.py --only math-audit,constant-time,mutation-patterns,noise,simulate
      - name: Audits
        run: python tools/ci.py --only math-audit,constant-time,mutation-patterns,noise,simulate
