[package]
name = "bombe"
version = "0.1.0"
edition = "2021"
description = "Cryptanalysis workbench for the Turing cipher"
publish = false

[dependencies]
turing = { path = "../turing", features = ["analysis"] }
sha3 = "0.10"
zeroize = "1.9.0"

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_System_Memory", "Win32_System_Diagnostics_Debug", "Win32_System_Threading"] }

[target."cfg(unix)".dependencies]
libc = "0.2.189"
